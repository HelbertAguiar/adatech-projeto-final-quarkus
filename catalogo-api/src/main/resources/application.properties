# Configurações compartilhadas (Quarkus 3.40.1 / Java 21)
quarkus.http.port=9091
quarkus.http.test-port=0
catalogo.nome=Catálogo API

# Aulas 03/04: comunicação REST com o estoque-local.
quarkus.rest-client.estoque-local.url=${ESTOQUE_LOCAL_URL:http://127.0.0.1:8081}
quarkus.rest-client.estoque-local.connect-timeout=1000
quarkus.rest-client.estoque-local.read-timeout=1000

# Aula 05: H2 somente para dev/test/staging didático.
# db-kind é definido em BUILD-TIME: JAR de prod é construído para PostgreSQL.
quarkus.datasource.db-kind=h2
#quarkus.datasource.jdbc.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/catalogo;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Nunca usar drop-and-create fora de desenvolvimento/teste.
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%staging.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%staging.quarkus.hibernate-orm.sql-load-script=import.sql

# Profile prod: PostgreSQL privado na rede Docker; tabela criada por database/init.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogodb}
%prod.quarkus.datasource.username=${DB_USERNAME:catalogo}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.min-size=1
%prod.quarkus.datasource.jdbc.max-size=10
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
