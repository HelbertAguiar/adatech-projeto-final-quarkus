# Projeto final: Java 21 / Quarkus 3.40.1 / H2 persistente
quarkus.http.port=9091
quarkus.http.test-port=0
agendamento.nome=${AGENDAMENTO_NOME:Agendamento de Massagem}
agendamento.pronto=${AGENDAMENTO_PRONTO:true}

# Integração HTTP real com o mock local de feriados.
quarkus.rest-client.feriados.url=${FERIADOS_URL:http://127.0.0.1:8081}
quarkus.rest-client.feriados.connect-timeout=1000
quarkus.rest-client.feriados.read-timeout=1000

# dev, staging e prod preservam os dados entre reinicializações.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${AGENDAMENTO_DB_URL:jdbc:h2:file:./data/agendamentos}
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.sql-load-script=no-file

# Production container: PostgreSQL do Compose.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres:5432/catalogodb}
%prod.quarkus.datasource.username=${DB_USERNAME:catalogo}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.agendamento.nome=${AGENDAMENTO_NOME:Agendamento de Massagem - PROD}

# Somente testes recriam schema, sempre em memória; não acessam data/.
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:agendamento-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Material das aulas anteriores preservado; /catalogo/info evita disputar /info.
catalogo.nome=Catálogo API
